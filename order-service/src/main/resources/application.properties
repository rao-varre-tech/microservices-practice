spring.application.name=order-service
server.port=${PORT:8081}

# Replace with your GCP project id
#spring.cloud.gcp.project-id=project-be1e21d9-1f3f-4321-a48
#spring.cloud.gcp.pubsub.emulator-host=localhost:8085
spring.cloud.gcp.parametermanager.enabled=false
spring.cloud.gcp.secretmanager.enabled=false

# Where inventory-service runs (local). On Cloud Run this becomes its https URL.
inventory.url=${INVENTORY_URL:http://localhost:8082}

spring.datasource.url=jdbc:h2:mem:orderdb
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=order-service
